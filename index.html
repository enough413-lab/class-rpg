<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리반 RPG</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffaf2}#app{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="app.html" title="우리반 RPG"></iframe><script>
const frame=document.getElementById('app');
const IDLE_LIMIT=30*60*1000;
let idleTimer;
function resetIdle(){clearTimeout(idleTimer);idleTimer=setTimeout(()=>{try{frame.contentWindow.localStorage.removeItem('classRpgStudentToken')}catch{};location.reload()},IDLE_LIMIT)}
['click','keydown','pointerdown','touchstart'].forEach(type=>window.addEventListener(type,resetIdle,{passive:true}));resetIdle();
frame.addEventListener('load',()=>{try{
 const d=frame.contentDocument,w=frame.contentWindow;
 const s=d.createElement('style');
 s.textContent='.profile{grid-template-columns:280px minmax(0,1fr)!important}.avatar-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}.avatar-actions .btn{width:100%!important;min-width:0!important;white-space:nowrap!important;word-break:keep-all!important;font-size:13px!important;letter-spacing:-.2px!important;padding:10px 4px!important}.avatar-actions .map-btn{grid-column:1/-1!important;font-size:13px!important;padding:11px 6px!important}@media(max-width:650px){.profile{grid-template-columns:1fr!important}}@media(max-width:520px){.avatar-actions{grid-template-columns:repeat(2,minmax(0,1fr))!important}}.network-banner{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:9999;padding:9px 14px;border-radius:999px;background:#fff3d5;color:#7a5600;font-weight:900;box-shadow:0 5px 16px #0002}.network-banner.hidden{display:none!important}';
 d.head.appendChild(s);
 const banner=d.createElement('div');banner.className='network-banner hidden';banner.textContent='📶 인터넷 연결이 불안정해요. 연결되면 자동으로 다시 이용할 수 있어요.';d.body.appendChild(banner);
 const syncNetwork=()=>banner.classList.toggle('hidden',w.navigator.onLine);w.addEventListener('online',syncNetwork);w.addEventListener('offline',syncNetwork);syncNetwork();
 const mapBtn=d.querySelector('.avatar-actions .map-btn');
 if(mapBtn){const refreshLock=()=>{const locked=new Date().getHours()<14;mapBtn.textContent=locked?'🔒 학교 탐험 지도':'🗺️ 학교 탐험 지도';mapBtn.title=locked?'오후 2시 이후에 열려요':''};refreshLock();setInterval(refreshLock,60000);mapBtn.addEventListener('click',e=>{if(new Date().getHours()<14){e.preventDefault();e.stopImmediatePropagation();alert('학교 탐험 지도는 아직 열리지 않았습니다. 오후 2시 이후에 다시 이용해 주세요!')}},true)}
 d.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn||btn.disabled||btn.dataset.busy==='1')return;if(btn.matches('.shop-item .btn,.quest .btn.good,.reading-form .btn.good')){btn.dataset.busy='1';const old=btn.textContent;btn.disabled=true;setTimeout(()=>{btn.dataset.busy='0';btn.disabled=false;btn.textContent=old},1800)}},true);
 d.addEventListener('click',resetIdle,true);d.addEventListener('keydown',resetIdle,true);d.addEventListener('pointerdown',resetIdle,true);
}catch(e){console.error(e)}});
</script></body></html>
