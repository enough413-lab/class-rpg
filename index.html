<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리반 RPG</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffaf2}#app{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="app.html" title="우리반 RPG"></iframe><script>const frame=document.getElementById('app');frame.addEventListener('load',()=>{try{const d=frame.contentDocument,s=d.createElement('style');s.textContent='.profile{grid-template-columns:240px minmax(0,1fr)!important}.avatar-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important}.avatar-actions .btn{width:100%!important;min-width:0!important;white-space:nowrap!important;word-break:keep-all!important;font-size:12px!important;letter-spacing:-.35px!important;padding:9px 2px!important}.avatar-actions .map-btn{grid-column:1/-1!important;font-size:13px!important;padding:10px 6px!important}@media(max-width:650px){.profile{grid-template-columns:1fr!important}}@media(max-width:520px){.avatar-actions{grid-template-columns:repeat(2,minmax(0,1fr))!important}}';d.head.appendChild(s);const mapBtn=d.querySelector('.avatar-actions .map-btn');if(mapBtn){const refreshLock=()=>{const locked=new Date().getHours()<14;mapBtn.textContent=locked?'🔒 학교 탐험 지도':'🗺️ 학교 탐험 지도';mapBtn.title=locked?'오후 2시 이후에 열려요':''};refreshLock();mapBtn.addEventListener('click',e=>{if(new Date().getHours()<14){e.preventDefault();e.stopImmediatePropagation();alert('학교 탐험 지도는 아직 열리지 않았습니다. 오후 2시 이후에 다시 이용해 주세요!')}},true)}}catch(e){console.error(e)}});</script></body></html>
