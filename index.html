<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리반 RPG</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffaf2}#app{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="app.html" title="우리반 RPG"></iframe><script>const frame=document.getElementById('app');frame.addEventListener('load',()=>{try{const d=frame.contentDocument,s=d.createElement('style');s.textContent='.avatar-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}.avatar-actions .btn{width:100%!important;min-width:0!important;white-space:nowrap!important;word-break:keep-all!important;font-size:13px!important;padding:9px 5px!important}@media(max-width:520px){.avatar-actions{grid-template-columns:repeat(2,minmax(0,1fr))!important}}';d.head.appendChild(s)}catch(e){console.error(e)}});</script></body></html>
