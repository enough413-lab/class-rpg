<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리반 RPG</title><style>
:root{--cream:#fffaf2;--card:#fff;--ink:#3b2b24;--muted:#88786f;--line:#eadfd5;--blue:#6098d6;--pink:#e87899;--violet:#7167db;--gold:#f2b94b;--good:#33a46f;--danger:#d95768}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#fff 0,#fff9f0 45%,#f4f2ff 100%);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}.wrap{max-width:920px;margin:auto;padding:24px}.card{background:#fffc;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 18px 45px #60482d16;backdrop-filter:blur(8px)}.login{max-width:440px;margin:9vh auto;text-align:center}.logo{font-size:44px}.login h1{margin:4px 0 6px}.muted{color:var(--muted);font-size:14px}.field{text-align:left;margin:16px 0}.field label{display:block;font-weight:900;margin-bottom:7px}select,input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;font:inherit;font-size:17px}.btn{border:0;border-radius:13px;padding:12px 16px;background:#eee;color:var(--ink);font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--violet),#9a72dc);color:#fff;width:100%;font-size:17px}.btn.good{background:#e4f7ed;color:#18784c}.btn:disabled{opacity:.5}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.profile{display:grid;grid-template-columns:210px 1fr;gap:18px}.avatar{height:270px;display:grid;place-items:center}.avatar img{width:100%;height:100%;object-fit:contain}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#f0efff;color:#5249c0;font-weight:900;font-size:13px}.pill.gold{background:#fff3d5;color:#946000}.quests{display:grid;gap:11px}.quest{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}.quest-head{display:flex;justify-content:space-between;gap:10px}.badge{font-size:12px;font-weight:900;background:#f0efff;color:#534bc4;padding:5px 8px;border-radius:999px;white-space:nowrap}.setup{text-align:center}.gender-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.gender{border:2px solid var(--line);border-radius:18px;background:#fff;padding:10px;cursor:pointer;font:inherit;font-weight:900}.gender img{width:100%;height:230px;object-fit:contain;display:block}.gender.selected{border-color:var(--violet);background:#f5f3ff}.message{min-height:23px;margin:8px 0;font-weight:800;font-size:13px}.error{color:var(--danger)}.ok{color:var(--good)}@media(max-width:650px){.profile{grid-template-columns:1fr}.avatar{height:220px}.gender img{height:175px}.wrap{padding:13px}.card{padding:16px}.quest-head{display:block}.badge{display:inline-block;margin-top:5px}}
.level-card{margin-top:15px;padding:14px;border-radius:16px;background:linear-gradient(135deg,#f4f1ff,#fff8ed);border:1px solid #e6ddf7}.level-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:900}.level-number{font-size:22px;color:var(--violet)}.xp-track{height:14px;border-radius:999px;background:#e9e5ef;overflow:hidden;margin:10px 0 6px}.xp-fill{height:100%;width:0;background:linear-gradient(90deg,var(--violet),#d46fa3);border-radius:inherit;transition:width .35s ease}.xp-detail{text-align:right;color:var(--muted);font-size:13px;font-weight:800}
.quest-group{margin-top:18px}.quest-group:first-child{margin-top:0}.quest-group-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 9px;font-size:17px}.quest-repeat{font-size:12px;color:var(--muted);font-weight:800}.avatar-card{text-align:center}.avatar{position:relative;cursor:pointer;border-radius:18px;transition:.2s}.avatar:hover{background:#f8f5ff}.avatar:focus-visible{outline:3px solid var(--violet);outline-offset:3px}.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.avatar .avatar-base{z-index:1}.avatar .avatar-bottom{z-index:2}.avatar .avatar-top{z-index:3}.avatar .avatar-shoes{z-index:4}.inventory-hint{margin:8px 0 10px}.modal-backdrop{position:fixed;inset:0;background:#2d254b99;display:grid;place-items:center;padding:16px;z-index:80}.inventory-modal{width:min(680px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px;padding:20px;box-shadow:0 24px 70px #21183f55}.inventory-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.inventory-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.item-card{border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px;cursor:pointer;font:inherit;color:var(--ink);text-align:center}.item-card:hover{border-color:#b9b3f5}.item-card.equipped{border-color:var(--violet);background:#f3f1ff}.item-preview{width:100%;aspect-ratio:1;object-fit:contain;display:block}.item-name{display:block;font-weight:900}.item-state{display:block;font-size:12px;color:var(--muted);margin-top:4px}.item-card.equipped .item-state{color:var(--violet);font-weight:900}@media(max-width:520px){.inventory-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.avatar{overflow:hidden}.avatar-layer,.avatar-base,.outfit-slot,.outfit-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.avatar-hair-back{z-index:0}.avatar-base{z-index:1}.slot-shoes{z-index:2}.slot-bottom{z-index:3}.slot-top{z-index:4}.slot-equipment{z-index:5}.avatar-hair-front{z-index:6}.slot-hat{z-index:7}.slot-accessory{z-index:8}.avatar[data-template="boy"]{--template-width:1122;--template-height:1402}.avatar[data-template="girl"]{--template-width:1229;--template-height:1280}
</style></head><body><main class="wrap">
<section id="login" class="card login"><div class="logo">⚔️</div><h1>우리반 RPG</h1><p class="muted">내 번호와 비밀번호로 입장하세요!</p><div class="field"><label for="number">내 번호</label><select id="number"><option value="">번호를 골라요</option></select></div><div class="field"><label for="pin">비밀번호 4자리</label><input id="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="● ● ● ●" onkeydown="if(event.key==='Enter')studentLogin()"></div><div id="loginMsg" class="message"></div><button class="btn primary" onclick="studentLogin()">게임 시작!</button></section>
<section id="setup" class="card setup hidden"><h1>내 캐릭터 만들기</h1><p class="muted">한 번 정하면 성별과 닉네임은 다시 바꿀 수 없어요.</p><div class="gender-grid"><button id="boyBtn" class="gender" onclick="chooseGender('boy')"><img src="avatar-boy-cutout.png" alt="남자 캐릭터">남자</button><button id="girlBtn" class="gender" onclick="chooseGender('girl')"><img src="avatar-girl-cutout.png" alt="여자 캐릭터">여자</button></div><div class="field" style="max-width:420px;margin:16px auto;text-align:left"><label for="nickname">닉네임</label><input id="nickname" maxlength="16" placeholder="친구들과 겹치지 않게 지어 봐요"></div><div id="setupMsg" class="message"></div><button class="btn primary" onclick="finishSetup()">이 캐릭터로 시작하기</button></section>
<section id="dashboard" class="hidden"><div class="top"><div><h1 id="hello" style="margin:0">안녕!</h1><div class="muted">오늘도 멋진 모험을 시작해요</div></div><button class="btn" onclick="logout()">나가기</button></div><div class="profile"><section class="card avatar-card"><div class="avatar" role="button" tabindex="0" aria-label="내 아이템 열기" onclick="openInventory()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openInventory()}"><img id="avatarHairBack" class="avatar-layer avatar-hair-back hidden" alt=""><img id="avatarBase" class="avatar-base" alt="내 캐릭터"><span class="outfit-slot slot-shoes"><img id="avatarShoes" class="hidden" alt=""></span><span class="outfit-slot slot-bottom"><img id="avatarBottom" class="hidden" alt=""></span><span class="outfit-slot slot-top"><img id="avatarTop" class="hidden" alt=""></span><span class="outfit-slot slot-equipment"><img id="avatarEquipment" class="hidden" alt=""></span><img id="avatarHairFront" class="avatar-layer avatar-hair-front" alt=""><span class="outfit-slot slot-hat"><img id="avatarHat" class="hidden" alt=""></span><span class="outfit-slot slot-accessory"><img id="avatarAccessory" class="hidden" alt=""></span></div><div class="muted inventory-hint">캐릭터를 눌러 옷을 갈아입어 보세요!</div><button class="btn primary" onclick="openInventory()">🎒 내 아이템</button></section><div><section class="card"><h2 style="margin-top:0">내 성장</h2><div class="stats"><span id="level" class="pill"></span><span id="gold" class="pill gold"></span></div><div class="level-card"><div class="level-row"><span>다음 레벨까지</span><span id="levelNumber" class="level-number">Lv.1</span></div><div class="xp-track"><div id="xpFill" class="xp-fill"></div></div><div id="xpDetail" class="xp-detail">0 / 20 XP</div></div></section><section class="card"><div class="quest-head"><h2 style="margin:0">오늘의 퀘스트</h2><button class="btn" onclick="loadDashboard()">새로고침</button></div><div id="quests" class="quests" style="margin-top:14px"></div></section></div></div></section>
</main><div id="inventoryModal" class="modal-backdrop hidden" onclick="if(event.target===this)closeInventory()"><section class="inventory-modal" role="dialog" aria-modal="true" aria-labelledby="inventoryTitle"><div class="inventory-top"><div><h2 id="inventoryTitle" style="margin:0">🎒 내 아이템</h2><div class="muted">아이템을 누르면 장착되고, 장착한 아이템을 다시 누르면 벗어요.</div></div><button class="btn" onclick="closeInventory()" aria-label="닫기">닫기</button></div><div id="inventoryGrid" class="inventory-grid"></div><div id="inventoryMsg" class="message"></div></section></div><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://dgqtxavsymvwjeyyyjle.supabase.co','sb_publishable_-Cdj1Dj-KY3PsZxCcpM7Lg_etojZrmL');window.db=db;let token=localStorage.getItem('classRpgStudentToken')||'',gender='',inventory=[];let current=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));for(let n=1;n<=99;n++)$('number').insertAdjacentHTML('beforeend',`<option value="${n}">${n}번</option>`);function show(id){['login','setup','dashboard'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function err(id,text,ok=false){$(id).className='message '+(ok?'ok':'error');$(id).textContent=text}
const LEVEL_NEEDS=[60,90,120,180,240,300,390,480,600,...Array(5).fill(600),...Array(5).fill(750),...Array(5).fill(900),...Array(5).fill(1200)];
const LEVEL_TOTALS=[0];LEVEL_NEEDS.forEach(need=>LEVEL_TOTALS.push(LEVEL_TOTALS.at(-1)+need));
function levelInfo(xp){let level=1;for(let i=1;i<LEVEL_TOTALS.length;i++)if(xp>=LEVEL_TOTALS[i])level=i+1;const start=LEVEL_TOTALS[level-1],next=LEVEL_TOTALS[level]??null,cur=xp-start,need=next===null?0:next-start;return{level,cur,need,pct:next===null?100:Math.min(100,Math.round(cur/need*100)),max:next===null}}
window.studentLogin=async()=>{const n=$('number').value,pin=$('pin').value;if(!n)return err('loginMsg','내 번호를 골라 주세요.');if(!/^\d{4}$/.test(pin))return err('loginMsg','비밀번호 숫자 4자리를 입력해 주세요.');err('loginMsg','입장하는 중...',true);const{data,error}=await db.rpc('student_login',{p_login_id:`ym32${String(n).padStart(2,'0')}`,p_pin:pin});if(error)return err('loginMsg',error.message);token=data[0].session_token;localStorage.setItem('classRpgStudentToken',token);current=data[0].student_data;if(!current.setup_complete)show('setup');else await loadDashboard()};
window.chooseGender=g=>{gender=g;$('boyBtn').classList.toggle('selected',g==='boy');$('girlBtn').classList.toggle('selected',g==='girl')};
window.finishSetup=async()=>{const nickname=$('nickname').value.trim();if(!gender)return err('setupMsg','남자 또는 여자 캐릭터를 선택해 주세요.');if(!nickname)return err('setupMsg','닉네임을 입력해 주세요.');if(!confirm(`성별: ${gender==='boy'?'남자':'여자'}\n닉네임: ${nickname}\n\n정말 이 설정으로 시작할까요?\n확정하면 다시 바꿀 수 없어요.`))return;const{error}=await db.rpc('student_complete_setup',{p_token:token,p_nickname:nickname,p_gender:gender});if(error)return err('setupMsg',error.message);await loadDashboard()};
const QUEST_GROUPS=[['daily','☀️ 일일 퀘스트','매일 다시 도전'],['weekly','📅 주간 퀘스트','매주 월요일 다시 도전'],['main','🏆 메인 퀘스트','한 번만 도전']];
function questCard(q){return `<div class="quest"><div class="quest-head"><b>${esc(q.title)}</b><span class="badge">+${q.xp} XP · +${q.gold} G</span></div><p class="muted">${esc(q.description)}</p>${q.status==='approved'?'<span class="badge">이번 회차 완료!</span>':q.status==='submitted'?'<button class="btn" disabled>선생님 확인 중</button>':`<button class="btn good" onclick="submitQuest(${q.id})">다 했어요!</button>`}</div>`}
function renderQuests(quests){if(!quests.length)return '<div class="muted">새 퀘스트를 기다리고 있어요.</div>';return QUEST_GROUPS.map(([type,title,repeat])=>{const items=quests.filter(q=>(q.quest_type||'main')===type);return items.length?`<section class="quest-group"><h3 class="quest-group-title"><span>${title}</span><span class="quest-repeat">${repeat}</span></h3>${items.map(questCard).join('')}</section>`:''}).join('')}
const SLOT_LAYER={equipment:'avatarEquipment',top:'avatarTop',bottom:'avatarBottom',shoes:'avatarShoes',hat:'avatarHat',accessory:'avatarAccessory'},SLOT_NAME={equipment:'장비',top:'상의',bottom:'하의',shoes:'신발',hat:'모자',accessory:'장신구'};
const ASSET_VERSION='20260901-layer-v1',assetUrl=image=>image+(image.includes('?')?'&':'?')+'v='+ASSET_VERSION;
function setOutfitLayer(layer,image){layer.src=assetUrl(image);layer.classList.remove('hidden')}
function renderAvatar(){const isGirl=current.gender==='girl',avatar=$('avatarBase').closest('.avatar');avatar.dataset.template=current.gender;$('avatarBase').src=assetUrl(isGirl?'avatar-girl-layer-base.png':'avatar-boy-layer-base.png');$('avatarHairBack').src=isGirl?assetUrl('hair-girl-layer-back.png'):'';$('avatarHairBack').classList.toggle('hidden',!isGirl);$('avatarHairFront').src=assetUrl(isGirl?'hair-girl-layer-front.png':'hair-boy-layer-default.png');Object.values(SLOT_LAYER).forEach(id=>{const layer=$(id);layer.src='';layer.classList.add('hidden')});inventory.filter(i=>i.equipped).forEach(i=>{const layer=$(SLOT_LAYER[i.slot]);if(layer)setOutfitLayer(layer,i.image)})}
function renderInventory(){const order={equipment:1,top:2,bottom:3,shoes:4,hat:5,accessory:6};$('inventoryGrid').innerHTML=inventory.length?[...inventory].sort((a,b)=>(order[a.slot]||99)-(order[b.slot]||99)).map(i=>`<button class="item-card ${i.equipped?'equipped':''}" onclick="toggleItem('${i.item_id}')"><img class="item-preview" src="${esc(i.image)}" alt="${esc(i.name)}"><span class="item-name">${esc(i.name)}</span><span class="item-state">${SLOT_NAME[i.slot]||i.slot} · ${i.equipped?'장착 중':'눌러서 장착'}</span></button>`).join(''):'<div class="muted">아직 가진 아이템이 없어요.</div>'}
window.openInventory=()=>{$('inventoryModal').classList.remove('hidden');renderInventory()};window.closeInventory=()=>$('inventoryModal').classList.add('hidden');
window.toggleItem=async itemId=>{err('inventoryMsg','바꾸는 중...',true);const{error}=await db.rpc('student_toggle_item',{p_token:token,p_item_id:itemId});if(error)return err('inventoryMsg',error.message);await loadDashboard();renderInventory();err('inventoryMsg','옷차림을 저장했어요!',true)};
window.loadDashboard=async()=>{const{data,error}=await db.rpc('student_dashboard',{p_token:token});if(error){localStorage.removeItem('classRpgStudentToken');show('login');return err('loginMsg',error.message)}current=data.student;inventory=data.inventory||[];if(!current.setup_complete){show('setup');return}show('dashboard');const lv=levelInfo(current.xp);$('hello').textContent=`${current.nickname}, 안녕!`;renderAvatar();$('level').textContent=`⭐ Lv.${lv.level}`;$('levelNumber').textContent=`Lv.${lv.level}`;$('gold').textContent=`🪙 ${current.gold} G`;$('xpFill').style.width=`${lv.pct}%`;$('xpDetail').textContent=lv.max?`최고 레벨 · 누적 ${current.xp} XP`:`${lv.cur} / ${lv.need} XP`;$('quests').innerHTML=renderQuests(data.quests)};
window.submitQuest=async id=>{if(!confirm('이 퀘스트를 완료했다고 선생님께 알릴까요?'))return;const{error}=await db.rpc('student_submit_quest',{p_token:token,p_quest_id:id});if(error)return alert(error.message);await loadDashboard()};window.logout=()=>{localStorage.removeItem('classRpgStudentToken');token='';location.reload()};if(token)loadDashboard();
</script></body></html>
