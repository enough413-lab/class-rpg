import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://dgqtxavsymvwjeyyyjle.supabase.co','sb_publishable_-Cdj1Dj-KY3PsZxCcpM7Lg_etojZrmL');window.db=db;let token=localStorage.getItem('classRpgStudentToken')||'',gender='',inventory=[],shopItems=[],shopCategory='misc',mainQuestIndex={},activeMainQuestId=null,mainQuestScene=0;let current=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function show(id){['login','setup','dashboard'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function err(id,text,ok=false){$(id).className='message '+(ok?'ok':'error');$(id).textContent=text}

window.studentLogin=async()=>{const loginId=$('number').value,pin=$('pin').value;if(!loginId)return err('loginMsg','내 번호를 골라 주세요.');if(!/^\d{4}$/.test(pin))return err('loginMsg','비밀번호 숫자 4자리를 입력해 주세요.');err('loginMsg','입장하는 중...',true);const{data,error}=await db.rpc('student_login',{p_login_id:loginId,p_pin:pin});if(error)return err('loginMsg',error.message);token=data[0].session_token;localStorage.setItem('classRpgStudentToken',token);current=data[0].student_data;if(!current.setup_complete)show('setup');else await loadDashboard()};

window.finishSetup=async()=>{const nickname=$('nickname').value.trim();if(!gender)return err('setupMsg','남자 또는 여자 캐릭터를 선택해 주세요.');if(!nickname)return err('setupMsg','닉네임을 입력해 주세요.');if(!confirm(`성별: ${gender==='boy'?'남자':'여자'}\n닉네임: ${nickname}\n\n정말 이 설정으로 시작할까요?\n확정하면 다시 바꿀 수 없어요.`))return;const{error}=await db.rpc('student_complete_setup',{p_token:token,p_nickname:nickname,p_gender:gender});if(error)return err('setupMsg',error.message);await loadDashboard()};
const QUEST_GROUPS=[['main','🏆 메인 퀘스트','지금 꼭 해야 할 필수 모험'],['daily','☀️ 일일 퀘스트','매일 다시 도전'],['weekly','📅 주간 퀘스트','매주 월요일 다시 도전']];
function questCard(q,type){if(type==='main')return `<article class="quest quest-main"><div class="quest-head"><b>${esc(q.title)}</b><span class="badge">+${q.xp} XP · +${q.gold} G</span></div><p class="muted">${esc(q.description)}</p>${q.status==='accepted'?'<span class="badge">진행 중인 퀘스트에서 보고해요</span>':q.status==='submitted'?'<span class="badge">선생님 확인 중</span>':q.status==='approved'?'<span class="badge">완료!</span>':`<button class="btn good" onclick="openMainQuest(${q.id})">선생님의 의뢰서 보기</button>`}</article>`;return `<article class="quest quest-${type}"><div class="quest-head"><b>${esc(q.title)}</b><span class="badge">+${q.xp} XP · +${q.gold} G</span></div><p class="muted">${esc(q.description)}</p>${q.status==='approved'?'<span class="badge">이번 회차 완료!</span>':q.status==='submitted'?'<button class="btn" disabled>선생님 확인 중</button>':`<button class="btn good" onclick="submitQuest(${q.id})">다 했어요!</button>`}</article>`}
function renderQuests(quests){mainQuestIndex=Object.fromEntries(quests.filter(q=>(q.quest_type||'main')==='main').map(q=>[q.id,q]));if(!quests.length)return '<div class="muted">새 퀘스트를 기다리고 있어요.</div>';const inProgress=quests.filter(q=>q.status==='accepted'),normal=quests.filter(q=>q.status!=='accepted');const progress=inProgress.length?`<section class="quest-group quest-group-main"><div class="quest-group-title"><div><span class="quest-kicker">수행 기록을 남겨 주세요</span><h3>📌 진행 중인 퀘스트</h3></div><span class="quest-repeat">완료 후 선생님 확인</span></div>${inProgress.map(q=>`<article class="quest quest-main"><div class="quest-head"><b>${esc(q.title)}</b><span class="badge">진행 중</span></div><p class="muted">${esc(q.description)}</p><button class="btn good" onclick="openProgressQuest(${q.id})">수행 기록 작성하기</button></article>`).join('')}</section>`:'';return progress+QUEST_GROUPS.map(([type,title,repeat])=>{const items=normal.filter(q=>(q.quest_type||'main')===type);if(!items.length)return '';if(type==='main')return `<section class="quest-group quest-group-main"><div class="quest-group-title"><div><span class="quest-kicker">가장 중요한 목표</span><h3>${title}</h3></div><span class="quest-repeat">${repeat}</span></div>${items.map(q=>questCard(q,type)).join('')}</section>`;return `<details class="quest-group quest-group-compact"><summary><span class="quest-summary-left"><span>${title}</span><span class="quest-count">${items.length}</span></span><span class="quest-repeat">${repeat}</span></summary><div class="quest-list">${items.map(q=>questCard(q,type)).join('')}</div></details>`}).join('')}
function mainQuestDialogue(q){const name=current?.nickname||'모험가',scenes=Array.isArray(q.dialogue)?q.dialogue.filter(scene=>typeof scene==='string'&&scene.trim()).map(scene=>scene.replaceAll('{{이름}}',name)):[];if(scenes.length)return scenes;return [`${name}아, 지금 “${q.title}” 때문에 도움이 필요해! ${q.description||'이 일을 함께 해결해 줄래?'} 네가 도와주면 정말 큰 힘이 될 거야.`]}
function renderMainQuestScene(){const q=mainQuestIndex[activeMainQuestId];if(!q)return;const scenes=mainQuestDialogue(q),last=mainQuestScene===scenes.length-1;$('mainQuestSpeech').textContent=scenes[mainQuestScene];$('mainQuestDialogueNav').innerHTML=scenes.length>1?`<button class="btn" onclick="previousMainQuestScene()" ${mainQuestScene===0?'disabled':''}>이전</button><span class="scene-indicator">${mainQuestScene+1} / ${scenes.length}</span><button class="btn" onclick="nextMainQuestScene()" ${last?'disabled':''}>다음</button>`:'';$('mainQuestDetails').classList.toggle('hidden',!last)}
window.openMainQuest=id=>{const q=mainQuestIndex[id];if(!q)return;activeMainQuestId=id;mainQuestScene=0;$('mainQuestSummary').textContent=q.title.includes('하기')?q.title:`${q.title} 해내기`;$('mainQuestReward').innerHTML=`<span class="reward-medal">✨ ${q.xp} XP</span><span class="reward-medal">🪙 ${q.gold} G</span>`;$('mainQuestAction').innerHTML=q.status==='approved'?'<span class="badge">완료한 메인 퀘스트예요!</span>':q.status==='submitted'?'<button class="btn" disabled>선생님 확인 중</button>':q.status==='accepted'?'<span class="badge">진행 중인 퀘스트에서 수행 기록을 작성해요.</span>':`<button class="btn good" onclick="startMainQuest(${q.id})">이 의뢰 맡기</button>`;renderMainQuestScene();$('mainQuestModal').classList.remove('hidden')};window.previousMainQuestScene=()=>{if(mainQuestScene>0){mainQuestScene--;renderMainQuestScene()}};window.nextMainQuestScene=()=>{const q=mainQuestIndex[activeMainQuestId],scenes=q?mainQuestDialogue(q):[];if(mainQuestScene<scenes.length-1){mainQuestScene++;renderMainQuestScene()}};window.closeMainQuest=()=>$('mainQuestModal').classList.add('hidden');window.startMainQuest=async id=>{const{error}=await db.rpc('student_accept_quest',{p_token:token,p_quest_id:id});if(error)return alert(error.message);closeMainQuest();await loadDashboard()};
let activeProgressQuestId=null,progressQuestImage='';
function ensureProgressModal(){if($('progressQuestModal'))return;document.head.insertAdjacentHTML('beforeend','<style>.progress-quest-modal .field{margin:14px 0}.progress-quest-modal textarea{min-height:110px}.evidence-preview{display:block;max-width:100%;max-height:220px;object-fit:contain;border-radius:12px;margin-top:10px;border:1px solid #e7e8ef}</style>');document.body.insertAdjacentHTML('beforeend','<div id="progressQuestModal" class="modal-backdrop hidden" onclick="if(event.target===this)closeProgressQuest()"><section class="inventory-modal progress-quest-modal" role="dialog" aria-modal="true"><div class="inventory-top"><div><h2 style="margin:0">📝 퀘스트 수행 기록</h2><div id="progressQuestName" class="muted"></div></div><button class="btn" onclick="closeProgressQuest()">닫기</button></div><div class="field"><label>어떻게 수행했나요?</label><textarea id="progressQuestText" placeholder="예: 친구들과 함께 책상을 정리하고 바닥을 쓸었어요."></textarea></div><div class="field"><label>사진 첨부 (선택)</label><input id="progressQuestPhoto" type="file" accept="image/*"><div class="muted" style="margin-top:5px">사진은 한 장만, 1.5MB 이하로 올려 주세요.</div><img id="progressQuestPreview" class="evidence-preview hidden" alt="첨부 사진 미리보기"></div><div id="progressQuestMsg" class="message"></div><button class="btn good" onclick="submitProgressQuest()">퀘스트 완료 보고하기</button></section></div>');$('progressQuestPhoto').addEventListener('change',readProgressQuestPhoto)}
window.openProgressQuest=id=>{ensureProgressModal();const q=mainQuestIndex[id];if(!q)return;activeProgressQuestId=id;progressQuestImage='';$('progressQuestName').textContent=q.title;$('progressQuestText').value='';$('progressQuestPhoto').value='';$('progressQuestPreview').classList.add('hidden');err('progressQuestMsg','');$('progressQuestModal').classList.remove('hidden')};window.closeProgressQuest=()=>{$('progressQuestModal')?.classList.add('hidden')};
async function readProgressQuestPhoto(event){const file=event.target.files?.[0];if(!file){progressQuestImage='';return}if(file.size>1500000){event.target.value='';return err('progressQuestMsg','사진은 1.5MB 이하만 첨부할 수 있어요.')}const reader=new FileReader();reader.onload=()=>{progressQuestImage=String(reader.result||'');$('progressQuestPreview').src=progressQuestImage;$('progressQuestPreview').classList.remove('hidden');err('progressQuestMsg','')};reader.readAsDataURL(file)}
window.submitProgressQuest=async()=>{const report=$('progressQuestText').value.trim();if(!report)return err('progressQuestMsg','수행한 내용을 한 줄 이상 적어 주세요.');err('progressQuestMsg','선생님께 보고하는 중...',true);const{error}=await db.rpc('student_submit_quest_evidence',{p_token:token,p_quest_id:activeProgressQuestId,p_report:report,p_image:progressQuestImage||null});if(error)return err('progressQuestMsg',error.message);closeProgressQuest();await loadDashboard()};
const SLOT_LAYER={equipment:'avatarEquipment',top:'avatarTop',bottom:'avatarBottom',shoes:'avatarShoes',hat:'avatarHat',accessory:'avatarAccessory'},SLOT_NAME={equipment:'장비',top:'상의',bottom:'하의',shoes:'신발',hat:'모자',accessory:'장신구'};
const ASSET_VERSION='20260902-school-shop',ASSET_ALIASES={'item-boy-top-basic.png':'3.top/top_boy_basic.png','item-girl-top-basic.png':'3.top/top_girl_basic.png','item-boy-bottom-basic.png':'4.bottom/bottom_boy_basic.png','item-girl-bottom-basic.png':'4.bottom/bottom_girl_basic.png','item-boy-shoes-basic.png':'7.shoes/shoes_boy_basic.png','item-girl-shoes-basic.png':'7.shoes/shoes_girl_basic.png'},assetUrl=image=>{const path=ASSET_ALIASES[image]||image;return path+(path.includes('?')?'&':'?')+'v='+ASSET_VERSION};
function setOutfitLayer(layer,image){layer.src=assetUrl(image);layer.classList.remove('hidden')}
function renderAvatar(){const isGirl=current.gender==='girl',avatar=$('avatarBase').closest('.avatar');avatar.dataset.template=current.gender;$('avatarBase').src=assetUrl(isGirl?'1. character/character_girl.png':'1. character/character_boy.png');$('avatarHairBack').src=isGirl?assetUrl('2.hair/hair_girl_default_back.png'):'';$('avatarHairBack').classList.toggle('hidden',!isGirl);$('avatarHairFront').src=assetUrl(isGirl?'2.hair/hair_girl_default_front.png':'2.hair/hair_boy_default.png');Object.values(SLOT_LAYER).forEach(id=>{const layer=$(id);layer.src='';layer.classList.add('hidden')});inventory.filter(i=>i.equipped).forEach(i=>{const layer=$(SLOT_LAYER[i.slot]);if(layer)setOutfitLayer(layer,i.image)})}
function renderInventory(){const order={equipment:1,top:2,bottom:3,shoes:4,hat:5,accessory:6};$('inventoryGrid').innerHTML=inventory.length?[...inventory].sort((a,b)=>(order[a.slot]||99)-(order[b.slot]||99)).map(i=>`<button class="item-card ${i.equipped?'equipped':''}" onclick="toggleItem('${i.item_id}')"><img class="item-preview" src="${esc(assetUrl(i.image))}" alt="${esc(i.name)}"><span class="item-name">${esc(i.name)}</span><span class="item-state">${SLOT_NAME[i.slot]||i.slot} · ${i.equipped?'장착 중':'눌러서 장착'}</span></button>`).join(''):'<div class="muted">아직 가진 아이템이 없어요.</div>'}
window.openInventory=()=>{$('inventoryModal').classList.remove('hidden');renderInventory()};window.closeInventory=()=>$('inventoryModal').classList.add('hidden');
window.toggleItem=async itemId=>{err('inventoryMsg','바꾸는 중...',true);const{error}=await db.rpc('student_toggle_item',{p_token:token,p_item_id:itemId});if(error)return err('inventoryMsg',error.message);await loadDashboard();renderInventory();err('inventoryMsg','옷차림을 저장했어요!',true)};
const SHOP_CATEGORIES=[['weapon','⚔️ 무기'],['armor','🛡️ 방어구'],['top','👕 상의'],['bottom','👖 하의'],['shoes','👟 신발'],['misc','🎟️ 기타']];
window.chooseShopCategory=category=>{shopCategory=category;renderShop()};
function renderShop(){const grid=$('shopGrid');$('shopGold').textContent=`🪙 ${current?.gold||0} G`;$('shopTabs').innerHTML=SHOP_CATEGORIES.map(([key,label])=>`<button class="shop-tab ${key===shopCategory?'active':''}" onclick="chooseShopCategory('${key}')">${label}</button>`).join('');const items=shopItems.filter(i=>i.category===shopCategory);grid.innerHTML=items.length?items.map(i=>`<article class="shop-item ${i.owned?'owned':''}">${i.image?`<img class="item-preview" src="${esc(i.image)}" alt="${esc(i.name)}">`:`<div class="shop-icon" role="img" aria-label="${esc(i.name)}">${esc(i.icon||'🎁')}</div>`}<span class="item-name">${esc(i.name)}</span><span class="shop-desc">${esc(i.description||'')}</span><span class="shop-price">🪙 ${i.price} G</span><button class="btn ${i.owned?'':'good'}" ${i.owned?'disabled':''} onclick="buyItem('${i.product_id}',${i.price},'${esc(i.kind)}')">${i.owned?(i.kind==='coupon'?'교환 요청 완료':'이미 가지고 있어요'):'구매하기'}</button></article>`).join(''):`<div class="shop-empty muted">${SHOP_CATEGORIES.find(x=>x[0]===shopCategory)?.[1]} 상품은 곧 추가될 예정이에요.</div>`}
async function loadShop(){err('shopMsg','상품을 불러오는 중...',true);const{data,error}=await db.rpc('student_shop',{p_token:token});if(error){shopItems=[];renderShop();return err('shopMsg','상점 준비 파일을 Supabase에 먼저 적용해 주세요.')}shopItems=Array.isArray(data)?data:[];renderShop();err('shopMsg','')}
window.openShop=async()=>{$('shopModal').classList.remove('hidden');await loadShop()};window.closeShop=()=>$('shopModal').classList.add('hidden');
window.buyItem=async(productId,price,kind)=>{if(current.gold<price)return err('shopMsg','골드가 부족해요. 퀘스트를 완료해 골드를 모아 보세요.');if(!confirm(`${price}골드로 이 상품을 살까요?${kind==='coupon'?'\n구매 후 선생님께 교환을 요청하게 돼요.':''}`))return;err('shopMsg','구매하는 중...',true);const{error}=await db.rpc('student_buy_product',{p_token:token,p_product_id:productId});if(error)return err('shopMsg',error.message);await loadDashboard();await loadShop();err('shopMsg',kind==='coupon'?'교환 요청을 보냈어요! 선생님께 보여 주세요.':'새 아이템을 구매했어요! 내 아이템에서 장착해 보세요.',true)};
window.loadDashboard=async()=>{const{data,error}=await db.rpc('student_dashboard',{p_token:token});if(error){localStorage.removeItem('classRpgStudentToken');show('login');return err('loginMsg',error.message)}current=data.student;inventory=data.inventory||[];if(!current.setup_complete){show('setup');return}show('dashboard');const lv=levelInfo(current.xp);$('hello').textContent=`${current.nickname}, 안녕!`;renderAvatar();$('level').textContent=`⭐ Lv.${lv.level}`;$('levelNumber').textContent=`Lv.${lv.level}`;$('gold').textContent=`🪙 ${current.gold} G`;$('xpFill').style.width=`${lv.pct}%`;$('xpDetail').textContent=lv.max?`최고 레벨 · 누적 ${current.xp} XP`:`${lv.cur} / ${lv.need} XP`;$('quests').innerHTML=renderQuests(data.quests)};
window.submitQuest=async id=>{if(!confirm('이 퀘스트를 완료했다고 선생님께 알릴까요?'))return;const{error}=await db.rpc('student_submit_quest',{p_token:token,p_quest_id:id});if(error)return alert(error.message);await loadDashboard()};window.logout=()=>{localStorage.removeItem('classRpgStudentToken');token='';location.reload()};loadStudentOptions();if(token)loadDashboard();
</script></body></html>
