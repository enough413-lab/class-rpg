<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>퀘스트별 승인 미리보기</title><style>body{margin:0;padding:24px;background:#f6f7fb;color:#252736;font-family:system-ui,sans-serif}.card{max-width:620px;margin:auto;background:#fff;padding:24px;border-radius:18px}.btn{border:0;border-radius:11px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;background:#eceef5;color:#252736}.btn.good{background:#e6f7ef;color:#17774a}select{border:1px solid #e7e8ef;border-radius:11px;padding:11px;font:inherit;background:white}*{box-sizing:border-box}#results{white-space:pre-wrap;line-height:1.8}.note{font-size:14px;color:#62677a}</style><main class="card"><p class="note">미리보기 · 가상 학생 기록입니다</p><h1>📋 퀘스트별 완료 요청</h1><p class="note">퀘스트를 눌러 수행 기록을 확인하고 선택 승인해요.</p><b id="count"></b><div id="submissions"></div><hr><button class="btn" id="run">선택·승인 동작 검사</button><pre id="results"></pre></main><script type="module">
import {createQuestReviews,groupQuestReviews} from '../teacher-quest-reviews.js';
const baseQuests=[{id:1,title:'1인 1역',quest_type:'daily',active:true},{id:2,title:'세븐브릭스',quest_type:'weekly',active:true},{id:3,title:'독서 퀘스트',quest_type:'main',active:true},{id:4,title:'1인 1역',quest_type:'main',active:true}];
const makeRow=(id,quest_id,period_key='2026-09-17')=>({id,quest_id,period_key,status:'submitted',submitted_at:'2026-09-17T02:30:00Z',report_text:['오늘 칠판을 닦고 지우개를 정리했어요.','급식 시간에 식판 정리를 도왔어요.','분리수거함을 비우고 주변도 청소했어요.'][id%3],students:{student_number:id,nickname:`모험가 ${id}`},quests:baseQuests.find(q=>q.id===quest_id)});
let quests=structuredClone(baseQuests),rows=[makeRow(1,1),makeRow(2,1),makeRow(3,1,'2026-09-16'),makeRow(4,2,'2026-09-14'),makeRow(5,3),makeRow(6,4)],calls=[],fail=false,readFail=false;
rows[0].evidence_image='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+aWZsAAAAASUVORK5CYII=';
const db={from(table){const query={select(){return query},eq(){return query},order(){return query},async range(a,b){return readFail?{error:{message:'읽기 실패'}}:{data:structuredClone((table==='quests'?quests:rows.filter(r=>r.status==='submitted')).slice(a,b+1))}}};return query},async rpc(name,args){calls.push({name,args});if(fail)return {error:{message:'테스트 연결 오류'}};const ids=args.p_submission_ids||[args.target_submission];rows.forEach(r=>{if(ids.includes(r.id))r.status=args.p_approve?'approved':'rejected'});return {error:null}}};
let ui=createQuestReviews({root:document.querySelector('#submissions'),db,refresh:()=>ui.load(),onCount:n=>document.querySelector('#count').textContent=`전체 승인 대기 ${n??'?'}건`});await ui.load();
document.querySelector('#run').onclick=async()=>{
 const out=document.querySelector('#results');out.textContent='검사 중…';let log=[];const check=(v,msg)=>{if(!v)throw Error(msg);log.push('통과 · '+msg)};const tick=()=>new Promise(r=>setTimeout(r,20));const dialog=document.querySelector('.qr-dialog');const q=s=>dialog.querySelector(s);const open=id=>document.querySelector(`[data-quest="${id}"]`).click();const close=()=>q('[data-close]').click();const originalConfirm=window.confirm,originalPrompt=window.prompt;window.confirm=()=>true;window.prompt=()=> '수행 내용을 더 자세히 써 주세요.';
 try{
  check(document.querySelectorAll('.qr-banner').length===4,'같은 이름도 퀘스트 ID별로 구분');open(1);q('[data-all]').click();check(dialog.querySelectorAll('[data-row]:checked').length===3,'현재 퀘스트만 전체 선택');q('[data-row="2"]').click();check(q('[data-all]').indeterminate,'일부 선택 해제 상태 표시');q('[data-approve]').click();await tick();check(JSON.stringify(calls.at(-1).args.p_submission_ids)==='[1,3]','선택한 기록만 승인 API에 전달');check(rows.find(r=>r.id===4).status==='submitted','다른 퀘스트 보상에 영향 없음');check(dialog.open&&q('#qrTitle').textContent==='1인 1역','승인 후 같은 퀘스트 유지');check(q('[data-approve]').disabled,'승인 후 선택 초기화');close();open(2);check(dialog.querySelectorAll('[data-row]:checked').length===0,'다른 퀘스트 진입 시 선택 초기화');q('[data-reject]').click();await tick();check(calls.at(-1).args.p_reason==='수행 내용을 더 자세히 써 주세요.','개별 보완 요청 사유 전달');close();
  rows=[makeRow(1,1),makeRow(2,1,'2026-09-16')];await ui.load();open(1);q('[data-all]').click();q('[data-period]').value='2026-09-17';q('[data-period]').dispatchEvent(new Event('change',{bubbles:true}));check(dialog.querySelectorAll('[data-row]').length===1&&!q('[data-all]').checked,'회차 변경 시 필터·선택 초기화');q('[data-all]').click();rows[0].report_text='새로 수정한 기록';await ui.load();check(!q('[data-all]').checked,'제출 내용이 바뀌면 기존 선택 해제');
  q('[data-all]').click();fail=true;q('[data-approve]').click();await tick();check(q('.qr-message').textContent.includes('테스트 연결 오류')&&q('[data-approve]').disabled,'승인 실패를 표시하고 재선택 요구');fail=false;close();
  rows=Array.from({length:501},(_,i)=>makeRow(i+1,1));await ui.load();open(1);check(dialog.querySelectorAll('[data-row]').length===501,'500건을 초과하는 목록도 모두 조회');close();
  readFail=true;try{await ui.load()}catch{}check(document.querySelector('[data-retry]')!==null,'읽기 실패 시 재시도 제공');readFail=false;
  rows=[makeRow(1,1),makeRow(2,1),makeRow(3,1,'2026-09-16'),makeRow(4,2,'2026-09-14'),makeRow(5,3),makeRow(6,4)];await ui.load();out.textContent=log.join('\n')+'\n전체 검사 통과';
 }catch(e){out.textContent=log.join('\n')+'\n실패: '+e.message}finally{window.confirm=originalConfirm;window.prompt=originalPrompt;if(dialog.open)dialog.close()}
};
</script></html>
