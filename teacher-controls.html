<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리반 RPG · 기능 설정</title><style>body{margin:0;background:#f6f7fb;color:#252736;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:560px;margin:8vh auto;padding:18px}.card{background:#fff;border:1px solid #e7e8ef;border-radius:20px;padding:22px;box-shadow:0 12px 30px #25273610}.field{margin:12px 0}.field label{display:block;font-weight:900;margin-bottom:6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #e7e8ef;border-radius:12px;font:inherit}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}.primary{background:#6c63ff;color:#fff;width:100%}.good{background:#e6f7ef;color:#17774a}.danger{background:#ffe8ec;color:#a72e44}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.muted{color:#777d91;font-size:13px}.status{padding:14px;border-radius:14px;margin:14px 0;font-weight:900}.on{background:#e6f7ef;color:#17774a}.off{background:#fff3d5;color:#856000}.hidden{display:none!important}a{color:#5a52d8}</style></head><body><main class="wrap"><section class="card"><div class="row"><div><h1 style="margin:0">⚙️ 우리반 RPG 기능 설정</h1><div class="muted">학생 기능을 선생님이 바로 열고 잠글 수 있어요.</div></div><a href="teacher.html">교사용으로 돌아가기</a></div><div id="loginBox"><div class="field"><label>이메일</label><input id="email" type="email"></div><div class="field"><label>비밀번호</label><input id="password" type="password"></div><button class="btn primary" id="loginBtn">로그인</button><div id="loginMsg" class="muted" style="margin-top:10px"></div></div><div id="controlBox" class="hidden"><div id="explorerStatus" class="status off">학교 탐험: 잠김</div><div class="row"><div><b>🗺️ 학교 탐험 지도</b><div class="muted">잠그면 학생 페이지와 직접 주소 모두에서 입장을 막아요.</div></div><button id="toggleBtn" class="btn good">공개하기</button></div><button id="logoutBtn" class="btn" style="margin-top:18px">로그아웃</button><div id="msg" class="muted" style="margin-top:10px"></div></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://dgqtxavsymvwjeyyyjle.supabase.co','sb_publishable_-Cdj1Dj-KY3PsZxCcpM7Lg_etojZrmL');const $=id=>document.getElementById(id);let enabled=false;async function render(){const{data,error}=await db.rpc('teacher_feature_settings');if(error||!data){$('msg').textContent=error?.message||'설정을 불러오지 못했어요.';return}enabled=!!data.explorer_enabled;$('explorerStatus').textContent=enabled?'학교 탐험: 공개 중':'학교 탐험: 잠김';$('explorerStatus').className='status '+(enabled?'on':'off');$('toggleBtn').textContent=enabled?'잠그기':'공개하기';$('toggleBtn').className='btn '+(enabled?'danger':'good')}async function start(){const{data}=await db.auth.getSession();const logged=!!data.session;$('loginBox').classList.toggle('hidden',logged);$('controlBox').classList.toggle('hidden',!logged);if(logged)await render()}$('loginBtn').onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginMsg').textContent=error?error.message:'';if(!error)await start()};$('toggleBtn').onclick=async()=>{$('toggleBtn').disabled=true;const{error}=await db.rpc('teacher_set_explorer_enabled',{p_enabled:!enabled});$('toggleBtn').disabled=false;$('msg').textContent=error?error.message:'저장했어요!';if(!error)await render()};$('logoutBtn').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.onAuthStateChange(()=>start());start();</script></body></html>
