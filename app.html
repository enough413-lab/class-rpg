<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리반 RPG</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffaf2}#core{display:block;width:100%;height:100%;border:0}.guard-toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:9999;padding:10px 16px;border-radius:999px;background:#fff3d5;color:#755300;font:900 14px system-ui,-apple-system,"Noto Sans KR",sans-serif;box-shadow:0 5px 16px #0002;display:none}</style></head><body><iframe id="core" src="app-core.html" title="우리반 RPG"></iframe><div id="guardToast" class="guard-toast"></div><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://dgqtxavsymvwjeyyyjle.supabase.co','sb_publishable_-Cdj1Dj-KY3PsZxCcpM7Lg_etojZrmL');
const frame=document.getElementById('core'),toast=document.getElementById('guardToast');
let access=false,originals={},hooked=false;
const lockedMessage='학교 탐험 지도는 아직 열리지 않았습니다. 선생님이 공개하면 이용할 수 있어요!';
function showToast(text){toast.textContent=text;toast.style.display='block';clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.style.display='none',2200)}
async function refreshAccess(){const token=localStorage.getItem('classRpgStudentToken')||'';if(!token){access=false;applyGuard();return false}try{const{data,error}=await db.rpc('student_explorer_access',{p_token:token});access=!error&&data===true}catch{access=false}applyGuard();return access}
function block(){showToast(lockedMessage);return false}
function applyGuard(){if(!hooked)return;const w=frame.contentWindow,d=frame.contentDocument,mapBtn=d?.querySelector('.avatar-actions .map-btn');if(mapBtn){mapBtn.textContent=access?'🗺️ 학교 탐험 지도':'🔒 학교 탐험 지도';mapBtn.title=access?'':'선생님이 아직 공개하지 않았어요.';mapBtn.style.opacity=access?'1':'.62'}['openAdventureMap','openClassroomHub','enterHubScene'].forEach(name=>{if(!originals[name]&&typeof w[name]==='function')originals[name]=w[name];if(originals[name])w[name]=access?originals[name]:(...args)=>block()});if(!access){d?.getElementById('classroomHub')?.classList.add('hidden');d?.getElementById('schoolExplorerModal')?.classList.add('hidden')}}
function installKeyGuard(){const w=frame.contentWindow,d=frame.contentDocument;if(!d||d.__rpgKeyGuard)return;d.__rpgKeyGuard=true;d.addEventListener('keydown',e=>{const key=e.key.toLowerCase(),dir={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[key];const hub=d.getElementById('classroomHub'),explorer=d.getElementById('schoolExplorerModal');const hubOpen=hub&&!hub.classList.contains('hidden'),explorerOpen=explorer&&!explorer.classList.contains('hidden');if(!hubOpen&&!explorerOpen)return;if(dir){e.preventDefault();e.stopImmediatePropagation();hubOpen&&typeof w.moveHub==='function'?w.moveHub(...dir):explorerOpen&&typeof w.moveExplorer==='function'&&w.moveExplorer(...dir)}else if(key==='e'||key==='enter'){e.preventDefault();e.stopImmediatePropagation();hubOpen&&typeof w.hubUseNearby==='function'?w.hubUseNearby():explorerOpen&&typeof w.interactExplorer==='function'&&w.interactExplorer()}else if(key==='escape'){e.preventDefault();e.stopImmediatePropagation();hubOpen&&typeof w.closeClassroomHub==='function'?w.closeClassroomHub():explorerOpen&&typeof w.closeSchoolExplorer==='function'&&w.closeSchoolExplorer()}},true)}
frame.addEventListener('load',()=>{hooked=true;installKeyGuard();setTimeout(()=>{Object.assign(originals,{openAdventureMap:frame.contentWindow.openAdventureMap,openClassroomHub:frame.contentWindow.openClassroomHub,enterHubScene:frame.contentWindow.enterHubScene});refreshAccess()},250)});
setInterval(refreshAccess,15000);
window.addEventListener('storage',refreshAccess);
</script></body></html>
