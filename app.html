<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리반 RPG</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffaf2}#core{display:block;width:100%;height:100%;border:0}.guard-toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:9999;padding:10px 16px;border-radius:999px;background:#fff3d5;color:#755300;font:900 14px system-ui,-apple-system,"Noto Sans KR",sans-serif;box-shadow:0 5px 16px #0002;display:none}.class-lock{position:fixed;inset:0;z-index:9998;display:none;place-items:center;background:linear-gradient(135deg,#fffaf2,#f2efff);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.class-lock.show{display:grid}.class-lock-card{width:min(460px,calc(100% - 32px));background:#fff;border:1px solid #eadfd5;border-radius:24px;padding:28px;text-align:center;box-shadow:0 18px 50px #4f436322}.class-lock-card .icon{font-size:52px}.class-lock-card h1{margin:8px 0}.class-lock-card p{color:#776b64;line-height:1.6}.class-lock-card button{border:0;border-radius:13px;padding:11px 16px;font:900 14px inherit;background:#eee8ff;color:#554bbd;cursor:pointer}</style></head><body><iframe id="core" src="app-core.html" title="우리반 RPG"></iframe><div id="guardToast" class="guard-toast"></div><div id="classLock" class="class-lock"><div class="class-lock-card"><div class="icon">📚</div><h1>지금은 수업 시간이에요</h1><p>선생님이 정한 이용 시간이 되면 자동으로 다시 열려요.<br>아침 시간·쉬는 시간·점심시간에 다시 와 주세요!</p><button id="checkAgain">다시 확인</button></div></div><script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://dgqtxavsymvwjeyyyjle.supabase.co','sb_publishable_-Cdj1Dj-KY3PsZxCcpM7Lg_etojZrmL');
const frame=document.getElementById('core'),toast=document.getElementById('guardToast'),classLock=document.getElementById('classLock');
let explorerAccess=false,siteAllowed=true,originals={},hooked=false,activeProgressQuestId=null;
const lockedMessage='학교 탐험 지도는 아직 열리지 않았습니다. 선생님이 공개하면 이용할 수 있어요!';
function showToast(text){toast.textContent=text;toast.style.display='block';clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.style.display='none',2200)}
function friendlyError(text){const s=String(text||'');if(/Failed to fetch|NetworkError|fetch/i.test(s))return'인터넷 연결이 불안정해요. 잠시 후 다시 시도해 주세요.';if(/JWT|session|expired|로그인이 만료/i.test(s))return'로그인이 만료됐어요. 다시 로그인해 주세요.';if(/duplicate|already exists/i.test(s))return'이미 처리된 내용이에요.';if(/permission|not allowed|권한/i.test(s))return'지금은 이 기능을 사용할 수 없어요.';return s}
async function refreshAccess(){const token=localStorage.getItem('classRpgStudentToken')||'';if(!token){explorerAccess=false;siteAllowed=true;applyGuard();return}try{const[ex,site]=await Promise.all([db.rpc('student_explorer_access',{p_token:token}),db.rpc('student_site_access',{p_token:token})]);explorerAccess=!ex.error&&ex.data===true;siteAllowed=!!(!site.error&&site.data?.allowed!==false)}catch{explorerAccess=false;siteAllowed=false}applyGuard()}
function block(){showToast(lockedMessage);return false}
function applyGuard(){classLock.classList.toggle('show',!siteAllowed);if(!hooked)return;const w=frame.contentWindow,d=frame.contentDocument,mapBtn=d?.querySelector('.avatar-actions .map-btn');if(mapBtn){mapBtn.textContent=explorerAccess?'🗺️ 학교 탐험 지도':'🔒 학교 탐험 지도';mapBtn.title=explorerAccess?'':'선생님이 아직 공개하지 않았어요.';mapBtn.style.opacity=explorerAccess?'1':'.62'}['openAdventureMap','openClassroomHub','enterHubScene'].forEach(name=>{if(!originals[name]&&typeof w[name]==='function')originals[name]=w[name];if(originals[name])w[name]=explorerAccess?originals[name]:(...args)=>block()});if(!explorerAccess){d?.getElementById('classroomHub')?.classList.add('hidden');d?.getElementById('schoolExplorerModal')?.classList.add('hidden')}}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=()=>reject(new Error('사진을 읽지 못했어요.'));r.readAsDataURL(file)})}
function disableLegacyReadingStorage(){const w=frame.contentWindow;if(w.__rpgLegacyReadingDisabled)return;w.__rpgLegacyReadingDisabled=true;const proto=w.Storage?.prototype;if(!proto)return;const nativeGet=proto.getItem,nativeSet=proto.setItem;proto.getItem=function(key){if(String(key).startsWith('classRpgReadingPortfolio_'))return null;return nativeGet.call(this,key)};proto.setItem=function(key,value){if(String(key).startsWith('classRpgReadingPortfolio_'))return;return nativeSet.call(this,key,value)}}
function injectCoreStyle(){const d=frame.contentDocument;if(!d||d.getElementById('rpgWrapperStyle'))return;const s=d.createElement('style');s.id='rpgWrapperStyle';s.textContent='.profile{grid-template-columns:280px minmax(0,1fr)!important}.avatar-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}.avatar-actions .btn{width:100%!important;min-width:0!important;white-space:nowrap!important;word-break:keep-all!important;font-size:13px!important;letter-spacing:-.2px!important;padding:10px 4px!important}.avatar-actions .map-btn{grid-column:1/-1!important;font-size:13px!important;padding:11px 6px!important}.rpg-dialog-backdrop{position:fixed;inset:0;z-index:12000;background:#2d254b99;display:grid;place-items:center;padding:18px}.rpg-dialog{width:min(420px,100%);background:linear-gradient(145deg,#fffdf8,#f7f2ff);border:2px solid #ddd2ff;border-radius:24px;padding:22px;box-shadow:0 24px 70px #21183f66;text-align:center}.rpg-dialog-icon{font-size:48px}.rpg-dialog h3{margin:7px 0 8px;font-size:22px}.rpg-dialog p{margin:0;color:#6f625a;white-space:pre-line;line-height:1.6}.rpg-dialog-actions{display:flex;justify-content:center;gap:9px;margin-top:18px}.rpg-dialog-actions .btn{min-width:104px}.purchase-pop{position:fixed;inset:0;z-index:11900;display:grid;place-items:center;pointer-events:none;background:#2d254b33}.purchase-card{padding:25px 30px;border-radius:24px;background:#fffdf8;border:3px solid #f0c45f;box-shadow:0 24px 65px #3a251b55;text-align:center;animation:purchasePop .5s cubic-bezier(.2,1.3,.45,1)}.purchase-card .emoji{font-size:58px;animation:purchaseBounce .6s ease-in-out}.purchase-card strong{display:block;font-size:22px;margin-top:7px}.purchase-card span{display:block;color:#966400;font-weight:900;margin-top:6px}@keyframes purchasePop{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}@keyframes purchaseBounce{50%{transform:translateY(-10px) rotate(5deg)}}.quest{position:relative}.quest-new-badge{position:absolute;right:10px;top:-9px;padding:4px 8px;border-radius:999px;background:#ff6d78;color:#fff;font-size:11px;font-weight:1000;box-shadow:0 3px 8px #b52b3f44;animation:newPulse 1.2s ease-in-out infinite}@keyframes newPulse{50%{transform:scale(1.08)}}@media(max-width:650px){.profile{grid-template-columns:1fr!important}}@media(max-width:520px){.avatar-actions{grid-template-columns:repeat(2,minmax(0,1fr))!important}}';d.head.appendChild(s)}
function installEvidenceUpload(){const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||w.__rpgEvidenceUploadInstalled)return;w.__rpgEvidenceUploadInstalled=true;const oldOpen=w.openProgressQuest;if(typeof oldOpen==='function')w.openProgressQuest=id=>{activeProgressQuestId=id;return oldOpen(id)};w.submitProgressQuest=async()=>{const report=d.getElementById('progressQuestText')?.value?.trim()||'';if(!report){const msg=d.getElementById('progressQuestMsg');if(msg){msg.className='message error';msg.textContent='수행한 내용을 한 줄 이상 적어 주세요.'}return}const btn=d.querySelector('#progressQuestModal button[onclick="submitProgressQuest()"]');if(btn)btn.disabled=true;const msg=d.getElementById('progressQuestMsg');const setMsg=(text,ok=false)=>{if(msg){msg.className='message '+(ok?'ok':'error');msg.textContent=text}};try{setMsg('선생님께 보고하는 중...',true);let imageUrl=null;const file=d.getElementById('progressQuestPhoto')?.files?.[0];if(file){if(file.size>1500000)throw new Error('사진은 1.5MB 이하만 첨부할 수 있어요.');const dataUrl=await fileToDataUrl(file);const{data,error}=await db.functions.invoke('upload-quest-evidence',{body:{token:localStorage.getItem('classRpgStudentToken')||'',quest_id:activeProgressQuestId,data_url:dataUrl}});if(error)throw error;if(data?.error)throw new Error(data.error);imageUrl=data?.url||null}const{error}=await db.rpc('student_submit_quest_evidence',{p_token:localStorage.getItem('classRpgStudentToken')||'',p_quest_id:activeProgressQuestId,p_report:report,p_image:imageUrl});if(error)throw error;if(typeof w.closeProgressQuest==='function')w.closeProgressQuest();if(typeof w.loadDashboard==='function')await w.loadDashboard()}catch(e){setMsg(friendlyError(e?.message||e))}finally{if(btn)btn.disabled=false}}}
function rpgDialog(message,{confirm=false,title,icon}={}){const d=frame.contentDocument;return new Promise(resolve=>{d.getElementById('rpgDialogBackdrop')?.remove();const back=d.createElement('div');back.id='rpgDialogBackdrop';back.className='rpg-dialog-backdrop';back.innerHTML=`<section class="rpg-dialog" role="dialog" aria-modal="true"><div class="rpg-dialog-icon">${icon|| (confirm?'✨':'💬')}</div><h3>${title|| (confirm?'확인해 주세요!':'알림')}</h3><p></p><div class="rpg-dialog-actions">${confirm?'<button class="btn" data-answer="no">취소</button>':''}<button class="btn good" data-answer="yes">${confirm?'확인':'좋아요!'}</button></div></section>`;back.querySelector('p').textContent=friendlyError(message);d.body.appendChild(back);const done=value=>{back.remove();resolve(value)};back.querySelector('[data-answer="yes"]').onclick=()=>done(true);back.querySelector('[data-answer="no"]')?.addEventListener('click',()=>done(false));back.addEventListener('click',e=>{if(e.target===back&&!confirm)done(true)})})}
function withConfirmedNative(w,fn,args){const native=w.confirm;w.confirm=()=>true;return Promise.resolve(fn(...args)).finally(()=>{w.confirm=native})}
function showPurchaseFx(name,price,kind){const d=frame.contentDocument;d.getElementById('purchasePop')?.remove();const el=d.createElement('div');el.id='purchasePop';el.className='purchase-pop';el.innerHTML=`<div class="purchase-card"><div class="emoji">${kind==='coupon'?'🎟️':'🎁'}</div><strong></strong><span>🪙 ${price} G 사용!</span></div>`;el.querySelector('strong').textContent=kind==='coupon'?`${name} 교환 요청 완료!`:`${name} 획득!`;d.body.appendChild(el);setTimeout(()=>el.remove(),1450)}
function installRpgDialogs(){const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||w.__rpgDialogsInstalled)return;w.__rpgDialogsInstalled=true;w.alert=msg=>{rpgDialog(String(msg||''),{icon:'💬'});return undefined};const finishBase=w.finishSetup;if(typeof finishBase==='function')w.finishSetup=async(...args)=>{const nick=d.getElementById('nickname')?.value?.trim()||'';const sex=d.querySelector('.gender.selected')?.textContent?.trim()||'선택한 캐릭터';const ok=await rpgDialog(`${sex}\n닉네임: ${nick}\n\n이 설정으로 시작할까요?\n확정하면 다시 바꿀 수 없어요.`,{confirm:true,title:'캐릭터 확정',icon:'🧙'});if(ok)return withConfirmedNative(w,finishBase,args)};const submitBase=w.submitQuest;if(typeof submitBase==='function')w.submitQuest=async(...args)=>{const ok=await rpgDialog('이 퀘스트를 완료했다고 선생님께 알릴까요?',{confirm:true,title:'퀘스트 완료 보고',icon:'🏆'});if(ok)return withConfirmedNative(w,submitBase,args)};const buyBase=w.buyItem;if(typeof buyBase==='function')w.buyItem=async(productId,price,kind)=>{const buttons=[...d.querySelectorAll('.shop-item button[onclick*="buyItem"]')],btn=buttons.find(b=>(b.getAttribute('onclick')||'').includes(`'${productId}'`)),name=btn?.closest('.shop-item')?.querySelector('.item-name')?.textContent?.trim()||'상품';const ok=await rpgDialog(`${name}\n${price}골드로 구매할까요?${kind==='coupon'?'\n구매 후 선생님께 교환 요청이 전송돼요.':''}`,{confirm:true,title:'상점 구매',icon:'🛍️'});if(!ok)return;await withConfirmedNative(w,buyBase,[productId,price,kind]);const msg=d.getElementById('shopMsg');if(msg?.classList.contains('ok'))showPurchaseFx(name,price,kind)}}
function installNewQuestBadges(){const d=frame.contentDocument,w=frame.contentWindow;if(!d||d.__rpgNewQuestInstalled)return;d.__rpgNewQuestInstalled=true;const key='classRpgSeenQuests_v1';const seen=()=>{try{return new Set(JSON.parse(localStorage.getItem(key)||'[]').map(String))}catch{return new Set}};const mark=id=>{const s=seen();s.add(String(id));localStorage.setItem(key,JSON.stringify([...s].slice(-300)))};const scan=()=>{const s=seen();d.querySelectorAll('.quest').forEach(card=>{const action=[...card.querySelectorAll('button[onclick]')].find(b=>/(openMainQuest|submitQuest|submitRepeatQuest)\(\d+\)/.test(b.getAttribute('onclick')||''));if(!action)return;const m=(action.getAttribute('onclick')||'').match(/(?:openMainQuest|submitQuest|submitRepeatQuest)\((\d+)\)/);if(!m)return;const id=m[1];if(!s.has(id)&&!card.querySelector('.quest-new-badge')){const badge=d.createElement('span');badge.className='quest-new-badge';badge.textContent='NEW!';card.appendChild(badge)}action.addEventListener('click',()=>{mark(id);card.querySelector('.quest-new-badge')?.remove()},{once:true,capture:true})})};new MutationObserver(()=>requestAnimationFrame(scan)).observe(d.body,{childList:true,subtree:true});scan()}
function installKeyGuard(){const w=frame.contentWindow,d=frame.contentDocument;if(!d||d.__rpgKeyGuard)return;d.__rpgKeyGuard=true;d.addEventListener('keydown',e=>{const key=e.key.toLowerCase(),dir={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[key];const hub=d.getElementById('classroomHub'),explorer=d.getElementById('schoolExplorerModal');const hubOpen=hub&&!hub.classList.contains('hidden'),explorerOpen=explorer&&!explorer.classList.contains('hidden');if(!hubOpen&&!explorerOpen)return;if(dir){e.preventDefault();e.stopImmediatePropagation();hubOpen&&typeof w.moveHub==='function'?w.moveHub(...dir):explorerOpen&&typeof w.moveExplorer==='function'&&w.moveExplorer(...dir)}else if(key==='e'||key==='enter'){e.preventDefault();e.stopImmediatePropagation();hubOpen&&typeof w.hubUseNearby==='function'?w.hubUseNearby():explorerOpen&&typeof w.interactExplorer==='function'&&w.interactExplorer()}else if(key==='escape'){e.preventDefault();e.stopImmediatePropagation();hubOpen&&typeof w.closeClassroomHub==='function'?w.closeClassroomHub():explorerOpen&&typeof w.closeSchoolExplorer==='function'&&w.closeSchoolExplorer()}},true)}
frame.addEventListener('load',()=>{hooked=true;injectCoreStyle();disableLegacyReadingStorage();installKeyGuard();setTimeout(()=>{Object.assign(originals,{openAdventureMap:frame.contentWindow.openAdventureMap,openClassroomHub:frame.contentWindow.openClassroomHub,enterHubScene:frame.contentWindow.enterHubScene});installEvidenceUpload();installRpgDialogs();installNewQuestBadges();refreshAccess()},350)});
document.getElementById('checkAgain').onclick=refreshAccess;setInterval(refreshAccess,15000);window.addEventListener('storage',refreshAccess);
</script></body></html>
