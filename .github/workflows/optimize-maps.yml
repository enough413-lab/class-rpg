name: Optimize map images

on:
  push:
    branches: [main]
    paths:
      - 'maps/*.png'
      - '.github/workflows/optimize-maps.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert maps to lightweight WebP
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          targets = [
              'classroom-hub.png',
              'classroom.png',
              'hallway.png',
              'library.png',
              'school-explorer.png',
          ]
          for name in targets:
              src = Path('maps') / name
              if not src.exists():
                  continue
              dst = src.with_suffix('.webp')
              with Image.open(src) as im:
                  im = im.convert('RGB')
                  max_w = 1400
                  if im.width > max_w:
                      h = round(im.height * max_w / im.width)
                      im = im.resize((max_w, h), Image.Resampling.LANCZOS)
                  im.save(dst, 'WEBP', quality=76, method=6)
                  print(f'{src}: {src.stat().st_size/1024:.0f} KB -> {dst}: {dst.stat().st_size/1024:.0f} KB')

          app = Path('app-core.html')
          if app.exists():
              text = app.read_text(encoding='utf-8')
              for name in targets:
                  text = text.replace(f'maps/{name}', f'maps/{Path(name).stem}.webp')
              app.write_text(text, encoding='utf-8')
          PY
      - name: Commit optimized maps and references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add maps/*.webp app-core.html
          if git diff --cached --quiet; then
            echo 'No map changes to commit.'
          else
            git commit -m 'perf: use compressed WebP map assets'
            git push
          fi
